name: Pull request checks

# Runs the format checks, the type checks, and the test suites on every pull request that targets main and on pushes
# to it, on Linux and on Windows. The repo ruleset "Requirements for merge" requires both matrix checks, so a pull
# request cannot merge unless they pass.
#
# The job id `checks` gives the required-check names `checks (ubuntu-latest)` and `checks (windows-latest)`.
# Never rename the job or the matrix values.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new push to the same branch or pull request cancels the previous run that is still in progress.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone repository to the runner machine
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install uv (it installs Python for the toolkit and runs pskill)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `npm ci` needs the committed package-lock.json. `--ignore-scripts` skips the lefthook `prepare` script, which a
      # runner with no git hooks does not need.
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        working-directory: toolkit
        run: uv sync --locked

      # The browser tests drive the Chrome that the GitHub runner images already include. Firefox exists only to test
      # that the configurator page works in it, so only the Linux job installs Playwright's Firefox build.
      - name: Install Firefox for the configurator tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: toolkit
        run: uv run playwright install --with-deps firefox

      - name: Require the Firefox tests on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "MYSTERY_FORGE_REQUIRE_FIREFOX=1" >> "$GITHUB_ENV"

      # One umbrella script, the same one that a developer runs locally, so CI and the local check cannot drift apart.
      # Order: JavaScript (format, types, tests), then the toolkit (format, lint, types, tests), then the pskill skills.
      - name: Run the checks
        run: npm run check
