schema: pskill/v1
id: solver-panel
description: >-
  Test a game with fresh solver subagents: each solver gets only what players have at one stage and tries to solve
  that stage's puzzles. A guesser gets only the premise. The toolkit then judges the answers against the official
  ones, finds ambiguous, too hard, and guessable puzzles, and reports them.
goal: A judged panel report for the current version of the game.
invocation: internal
inputs:
  game_dir: {type: string, description: "The game folder, the parent of source/."}
outputs:
  ok: {type: boolean, description: "true when every puzzle and accusation question passed."}
  failing: {type: array, items: {type: string}, description: "Each failing puzzle as '<code>: <verdict>: <reason>'."}
  failing_items:
    type: array
    description: "One fix task per failing puzzle or accusation question."
    items:
      type: object
      properties:
        name: {type: string}
        code: {type: string}
        verdict: {type: string}
        files: {type: array, items: {type: string}}
        findings_file: {type: string}
  report: {type: string, description: "The path of the judge report."}
entry: packets

blocks:
  packets:
    type: script
    description: Write one player packet per stage, and the guesser packet
    run: [uv, run, --project, ../toolkit, forge, packets, --game, "{{ inputs.game_dir }}"]
    parse: json
    timeout_s: 600
    next: solve

  solve:
    type: parallel
    description: Solve each stage with fresh solvers that see only the player packet
    for_each: "{{ steps.packets.json.solver_tasks }}"
    task_name: "{{ item.name }}"
    agent: solver
    instruction: instructions/solve.md
    output:
      status: {type: string, enum: [done, failed], description: "failed only when you could not read your packet."}
      answers:
        type: array
        description: "One entry per puzzle code that your packet lists under the puzzles to solve."
        items:
          type: object
          properties:
            code: {type: string}
            answer: {type: string}
            stuck: {type: boolean}
            reasoning: {type: string}
            evidence:
              type: array
              items:
                type: object
                properties:
                  document: {type: string}
                  quote: {type: string}
            candidates:
              type: array
              items:
                type: object
                properties:
                  answer: {type: string}
                  fits_all_clues: {type: boolean}
                  failing_clue: {type: string}
      accusation:
        type: array
        description: "Only when your packet has a final accusation: one entry per question. Otherwise an empty list."
        items:
          type: object
          properties:
            question: {type: string}
            option: {type: string}
            evidence:
              type: array
              items:
                type: object
                properties:
                  document: {type: string}
                  quote: {type: string}
    next: guess

  guess:
    type: parallel
    description: Guess the answers from the premise only
    for_each:
      - {name: guesser}
    task_name: "{{ item.name }}"
    agent: solver
    instruction: instructions/guess.md
    output:
      guesses:
        type: array
        description: "One guess per puzzle code."
        items:
          type: object
          properties:
            code: {type: string}
            answer: {type: string}
    next: judge

  judge:
    type: script
    description: Judge the answers against the official ones
    run: [uv, run, --project, ../toolkit, forge, judge, --game, "{{ inputs.game_dir }}"]
    input:
      solver_tasks: "{{ steps.packets.json.solver_tasks }}"
      solver_results: "{{ steps.solve.results }}"
      guesser_result: "{{ steps.guess.results[0] }}"
    parse: json
    timeout_s: 300
    next: judged

  judged:
    type: end
    description: The panel is judged
    status: succeeded
    outputs:
      ok: "{{ steps.judge.json.ok }}"
      failing: "{{ steps.judge.json.failing }}"
      failing_items: "{{ steps.judge.json.failing_items }}"
      report: "{{ steps.judge.json.report }}"
