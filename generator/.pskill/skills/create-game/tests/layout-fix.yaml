name: the visual review finds a required problem
inputs:
  config: c.json
scripts:
  doctor:
  - exit_code: 0
    stdout: '{"ok": true, "browser": "chrome", "desktop": "D", "downloads": "W"}'
  setup:
  - exit_code: 0
    stdout: '{"ok": true, "game_dir": "games/g", "config_file": "c.json", "summary": {"players": 4, "duration_minutes": 90,
      "difficulty": "medium", "language": "en", "audience": "family", "format": "both", "idea": "", "quality": "best", "pick_concept":
      "ask", "host": "self_running", "images": "svg"}, "brief": {"puzzle_count": 8, "stage_count": 3, "printed_pages": 20,
      "generation_minutes": 90}, "draw_file": "games/g/source/draw.json"}'
  writer_tasks:
  - exit_code: 0
    stdout: '{"ok": true, "tasks": [{"name": "P1 caesar-cipher", "id": "P1", "stage": "A", "mechanic": "caesar-cipher", "documents":
      ["D2"], "relies_on": []}, {"name": "P2 maze", "id": "P2", "stage": "B", "mechanic": "maze", "documents": ["D3"], "relies_on":
      ["D1"]}]}'
  render:
  - &id001
    exit_code: 0
    stdout: '{"ok": true, "report": "games/g/reports/render.json", "previews_dir": "games/g/render/previews", "fix_groups":
      []}'
  - *id001
  status:
  - exit_code: 0
    stdout: '{"ok": true, "stale": []}'
  export:
  - exit_code: 0
    stdout: '{"ok": true, "folder": "D/Mystery Forge/The Game", "files": ["1 - START HERE (manual).pdf", "2 - PRINT THIS (game
      materials).pdf"]}'
calls:
  story_check:
  - &id002
    status: succeeded
    outputs:
      ok: true
      errors: 0
      warnings: 1
      rounds: 0
      report: r.json
  plan_check:
  - *id002
  game_check:
  - *id002
  panel:
  - status: succeeded
    outputs:
      ok: true
      failing: []
      failing_items: []
      report: p.json
answers:
  confirm_config:
  - choice: go
    rationale: The user said so.
    $answered_by: human
  concepts:
  - teasers:
    - title: Title 1
      teaser: Teaser 1.
    - title: Title 2
      teaser: Teaser 2.
    - title: Title 3
      teaser: Teaser 3.
    summary: Three tones.
    recommended: second
    recommended_reason: It fits a family table best.
  pick_concept:
  - choice: second
    rationale: The user said so.
    $answered_by: human
  write_story:
  - summary: A ferry, five people, three envelopes.
  review_story:
  - findings: []
  plan:
  - summary: Eight puzzles, six actions.
  review_plan:
  - findings: []
  review_documents:
  - findings: []
  write_story_documents:
  - documents:
    - documents/D1.md
    summary: The briefing.
  write_puzzles:
  - status: written
    files:
    - puzzles/P1.yaml
    - documents/D2.md
    summary: A coded line.
  - status: written
    files:
    - puzzles/P2.yaml
    - documents/D3.md
    summary: A maze.
  illustrate:
  - images:
    - images/ferry-map.svg
    summary: A map and two stamps.
  visual_review:
  - findings:
    - severity: required
      page: materials-3.png
      problem: Cut grid.
      fix: Smaller maze.
    - severity: suggestion
      page: manual-1.png
      problem: Busy.
      fix: Less text.
  layout_fix:
  - changed_files:
    - puzzles/P2.yaml
    summary: Smaller maze.
expect:
  path:
  - doctor
  - setup
  - confirm_config
  - concepts
  - pick_concept
  - write_story
  - story_check
  - review_story
  - plan
  - plan_check
  - review_plan
  - write_story_documents
  - writer_tasks
  - write_puzzles
  - illustrate
  - game_check
  - review_documents
  - panel
  - render
  - visual_review
  - layout_fix
  - render
  - status
  - export
  - done
  status: succeeded
  outputs:
    result: exported
    folder: D/Mystery Forge/The Game
