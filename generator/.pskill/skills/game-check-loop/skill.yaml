schema: pskill/v1
id: game-check-loop
description: >-
  Check one part of a game (the story, the plan, or the full game) with the toolkit, and send each group of findings
  to a fixer subagent, round after round, until no error is left or the rounds run out.
goal: The checked part of the game has no error finding, or the run reports the errors that are left.
invocation: internal
inputs:
  game_dir: {type: string, description: "The game folder, the parent of source/."}
  scope: {type: string, enum: [story, plan, full], description: "What to check: story.yaml, the plan, or the full game."}
  max_rounds: {type: integer, optional: true, default: 4, description: "The most fix rounds."}
outputs:
  ok: {type: boolean, description: "true when no error is left."}
  errors: {type: integer, description: "How many errors are left."}
  warnings: {type: integer, description: "How many warnings are left."}
  rounds: {type: integer, description: "How many fix rounds ran."}
  report: {type: string, description: "The path of the last check report."}
entry: check

blocks:
  check:
    type: script
    description: Run the toolkit checks
    run: [uv, run, --project, ../toolkit, forge, check, --game, "{{ inputs.game_dir }}", --scope, "{{ inputs.scope }}"]
    parse: json
    timeout_s: 600
    next:
      - when: "{{ steps.check.json.ok }}"
        to: clean
      - when: "{{ (history.fix | length) >= inputs.max_rounds }}"
        to: errors_left
      - to: fix

  fix:
    type: parallel
    description: Fix each group of findings in a fresh subagent
    for_each: "{{ steps.check.json.fix_groups }}"
    task_name: "{{ item.name }}"
    agent: fixer
    instruction: instructions/fix.md
    max_visits: 8
    on_max_visits: errors_left
    output:
      status: {type: string, enum: [fixed, failed], description: "failed only when you could not change anything."}
      changed_files: {type: array, items: {type: string}, description: "The files that you changed."}
      summary: {type: string, description: "What you changed, in at most 5 short lines."}
    next: check

  clean:
    type: end
    description: No error is left
    status: succeeded
    outputs:
      ok: true
      errors: 0
      warnings: "{{ steps.check.json.warnings }}"
      rounds: "{{ history.fix | length }}"
      report: "{{ steps.check.json.report }}"

  errors_left:
    type: end
    description: The rounds ran out with errors left
    status: succeeded
    outputs:
      ok: false
      errors: "{{ steps.check.json.errors }}"
      warnings: "{{ steps.check.json.warnings }}"
      rounds: "{{ history.fix | length }}"
      report: "{{ steps.check.json.report }}"
