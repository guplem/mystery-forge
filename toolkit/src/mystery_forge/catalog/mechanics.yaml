  - id: riddle
    name: Riddle
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: A "what am I" verse whose answer is a word, often an object that unlocks the next step.
    how_it_works: >-
      A short verse describes a thing without naming it. The answer is a word, often an object in the story that
      opens the next step. Letter-count blanks confirm the answer.
    material: A verse on a scroll, plaque, or card, with letter-count blanks.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 4, medium: 8, hard: 13, expert: 18 }
    verification: panel
    builder: null
    pitfalls:
      - Several valid answers. Add letter-count blanks and one line that excludes the near answers.
      - LLMs reuse famous riddles (keys but no locks). Never use a known riddle. Write a new one about a story object.
    hint_ladder:
      - The verse on <document> describes something in this story.
      - Think of objects that you have seen in the kit. <restate the key line plainly>.
      - It has <N> letters and starts with <letter>. It is the <kind of object> from <document>.
    in_world_examples:
      - The rhyme on the music box that the grandmother left.
      - A riddle carved over the door of the tower.
