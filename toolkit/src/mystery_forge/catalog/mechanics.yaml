    minutes: { easy: 7, medium: 12, hard: 18, expert: 25 }
    verification: built
    builder: cross-document-lookup
    pitfalls:
      - Names or ids that change between documents (LLM drift). Render every id from the fact registry.
      - Every hop must exist, and the chain must lead to one answer only.
    hint_ladder:
      - Start with <fact> on <document>.
      - The <fact> appears somewhere else.
      - Check <second document>, then follow the chain. The second-to-last hop is <hop>.
