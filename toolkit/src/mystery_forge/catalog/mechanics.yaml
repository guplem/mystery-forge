  - id: keyboard-shift
    name: Keyboard Shift Cipher
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Each letter is the key next to the true letter on a QWERTY keyboard.
    how_it_works: >-
      The writer's hands were one key off. Each letter is the key to the right (or left) of the true letter on a
      QWERTY keyboard. Players shift each letter back on a printed keyboard.
    material: An email or chat log full of typos. A keyboard picture in the kit.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
