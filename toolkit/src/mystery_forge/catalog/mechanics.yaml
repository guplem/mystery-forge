    builder: keyboard-shift
    pitfalls:
      - AZERTY and QWERTZ keyboards break it. Choose the layout by the game language.
      - Define what edge keys (P, L, M) do.
    hint_ladder:
      - Look at the typo-ridden message on <document> and the keyboard on <other document>.
      - The typist's hands were in the wrong place.
      - Shift each letter one key to the left on the keyboard.
    in_world_examples:
      - An email that the victim typed in the dark.
      - A chat message sent from a phone in a pocket.
      - The hacker's note, typed with gloves on.
