  - id: word-ladder
    name: Word Ladder
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: Change one letter per step to go from one word to another.
    how_it_works: >-
      Players go from word A to word B by changing one letter per step. Clues define the middle rungs. The changed
      letters, or a shaded rung, give the answer.
    material: A ladder graphic with blanks and a clue per rung.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: false
