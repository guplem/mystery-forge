    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 9, hard: 14, expert: 20 }
    verification: panel
    builder: null
    pitfalls:
      - A picture read as another word, such as a cat read as kitten. Use a fixed icon library with one name each.
      - Sounds depend on accent and language. English only. Avoid it for other languages and multilingual groups.
    hint_ladder:
      - The pictures on <document> are one word.
      - Say the pictures out loud, one after the other.
      - Picture 1 is a <name>. Add the sounds of the pictures and do the letter steps.
