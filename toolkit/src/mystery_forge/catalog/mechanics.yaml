    hint_ladder:
      - Look at the wires on <document> and the legend on <other document>.
      - The wires match the legend on the box.
      - Read the wires left to right. Each pattern is one digit of the legend.
    in_world_examples:
      - The bomb's wires and the engineer's color chart.
