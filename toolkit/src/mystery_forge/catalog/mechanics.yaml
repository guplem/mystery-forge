  # Wordplay

  - id: anagram
    name: Anagram
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: The letters of a phrase rearrange into the answer.
    how_it_works: >-
      The letters of a name, title, or signature rearrange into the answer, often a suspect's real name or a place.
      A definition or a theme clue tells players what kind of word to look for.
    material: A suspicious name tag, a title, a signature, or a shop sign.
    answer_kinds: [word, name, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 10, hard: 15, expert: 22 }
    verification: verified
    builder: anagram
    pitfalls:
      - LLMs miscount letters all the time. Code checks that both sides use exactly the same letters.
      - A long anagram without a definition is unfair.
      - Check that no more obvious word uses the same letters.
      - Not as a gate for kids. Letter-order puzzles are hard for dyslexic players.
    hint_ladder:
      - Look at the name on <document>. It seems made up.
      - The name uses the same letters as something else in the story.
      - Rearrange the letters of the name. The result is a <kind of thing> from the story.
    in_world_examples:
      - The alias that the con artist signed in the hotel register.
      - The name of a ship that hides its true owner.
      - A shop sign that a proud baker made from his own name.
    combines_documents: false

  - id: acrostic
    name: Acrostic Letter or Poem
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: The first letters of the sentences, lines, or paragraphs spell the answer.
    how_it_works: >-
      The first letters of the sentences, lines, or paragraphs spell the answer. Variants use the last letters
      (telestich) or the first words. The text reads oddly stiff, which is the clue.
    material: A letter, poem, or list with fixed sentence or paragraph breaks.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: false
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 4, medium: 7, hard: 11, expert: 16 }
    verification: verified
    builder: acrostic
    pitfalls:
      - Text reflow at print time breaks line acrostics. Use sentences or paragraphs, or fixed line breaks.
      - The agent writes the text under the constraint. Code extracts the letters and rejects a mismatch.
    hint_ladder:
      - Read the letter on <document> again. The writing feels stiff, as if forced.
      - The message is not in the words. Look at where each sentence starts.
      - Read down the first letter of each <sentence or line>.
    in_world_examples:
      - The kidnapped man's letter home, written under the captor's eye.
      - A poem in the school yearbook that a student wrote for a secret friend.
      - A shopping list that a prisoner smuggled out.
    combines_documents: false

  - id: hidden-every-nth
    name: Every Nth Letter
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: Every Nth letter of an ordinary text spells the hidden message.
    how_it_works: >-
      A normal-looking text hides the message in every Nth letter, counting letters only. Another document gives N.
      Code checks the extraction, so the agent can write the text freely around the fixed letters.
    material: A short notice, letter, or label. N on another prop.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: false
    audiences: [family, teens, adults, puzzle_fans]
    difficulty: { min: medium, max: hard }
    minutes: { easy: 7, medium: 11, hard: 16, expert: 22 }
    verification: verified
    builder: hidden-every-nth
    pitfalls:
      - State whether spaces and punctuation count. The safe rule is to count letters only.
      - A long text makes the count tedious. Keep the source under about 150 letters.
      - The number N needs a clue, or players cannot find it.
    hint_ladder:
      - The notice on <document> hides a message. The number that you need is on <other document>.
      - The message is spread out inside the text, at a fixed step.
      - Count only letters. Take every <N>th letter and write them in order.
    in_world_examples:
      - A typed warning notice from the old printing shop.
      - The label of a wine bottle from the cellar.
      - A recipe card where the cook's grandchild hid a message.
    combines_documents: true

  - id: index-extraction
    name: Indexed Letter Extraction
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: Take letter N of each answer word, and the letters spell the final answer.
    how_it_works: >-
      Players get a list of words (or the answers to small clues) and a number for each. Letter N of each word gives
      one letter of the answer. This is the core extraction step of puzzle hunts.
    material: A clue list with numbers in brackets, or numbers hidden as page numbers, prices, or ages.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 6, medium: 11, hard: 16, expert: 22 }
    verification: verified
    builder: index-extraction
    pitfalls:
      - An index beyond the word length. Code checks every index.
      - Off-by-one with spaces. State the rule, for example "ignore spaces".
    hint_ladder:
      - Look at the list on <document>. The numbers next to each item matter.
      - Each number points to one letter of its word.
      - Take letter <N> of each word, in list order.
    in_world_examples:
      - The guest list with each guest's room number.
      - A museum label list with odd catalog numbers.
      - The evidence log where each item has a shelf number.
    combines_documents: false

  - id: rebus
    name: Rebus Picture Word
    category: wordplay
    player_action: wordplay
    lookup_cipher: false
    summary: Pictures and letters combine by sound, so EYE plus LAND is ISLAND.
    how_it_works: >-
      Icons and letters combine by their sound, with plus and minus letter steps. Players say the pictures aloud
      and join the sounds. The icons come from a fixed library with one name each.
