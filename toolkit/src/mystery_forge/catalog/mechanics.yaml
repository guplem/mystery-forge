# The puzzle mechanics catalog. Code reads it to pick mechanic candidates, to check variety, and to budget time.
# Field meanings: toolkit/src/mystery_forge/catalog/models.py (class Mechanic).
# hint_ladder: hint 1 = what you need and where to look, hint 2 = a nudge to the method, hint 3 = the method.
# minutes: baseline for a group of 3 or 4 players. Solo players take about 1.3 times longer, kids 8 to 12 about 1.5.
mechanics:
  # Ciphers

  - id: caesar-cipher
    name: Caesar Shift
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Every letter moves the same number of places along the alphabet.
    how_it_works: >-
      Each letter of the message moves N places along the alphabet. Another document gives N in the world: a clock
      that shows 3, "the third drawer", a house number. Players find N, then shift each letter back. Keep spaces and
      punctuation, so the word shapes help.
    material: A coded note, telegram, or wall writing. Optionally an alphabet strip printed on another prop.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 9, hard: 14, expert: 20 }
    verification: built
    builder: caesar-cipher
    pitfalls:
      - The shift is not clued, so players try all 25 shifts. It works, but it is boring.
      - A message that is too short is hard to recognize when it is correct.
      - Removed spaces and punctuation make it much harder. Keep them unless the difficulty is high.
    hint_ladder:
      - The coded text on <document> is the puzzle. The number that you need is on <other document>.
      - The letters are real letters, just moved. Every letter moved by the same number of steps.
      - Shift each letter back by <N> places in the alphabet. For example, D becomes A.
    in_world_examples:
      - A coded telegram from the smuggler, with the shift hidden in the stopped clock.
      - A school club's secret note, shifted by the club's founding number.
      - A Roman centurion's order, written the way his general taught him.
    combines_documents: true

  - id: atbash-cipher
    name: Atbash Mirror Alphabet
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: The alphabet is flipped, so A becomes Z and B becomes Y.
    how_it_works: >-
      Each letter swaps with its mirror partner: A with Z, B with Y, and so on. The game clues the idea with words
      like "mirror", "reflection", or "the end is the beginning". A prop can print A to M above Z to N.
    material: A coded inscription or note. Often a second prop that shows the two half alphabets.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 8, hard: 12, expert: 18 }
    verification: built
    builder: atbash-cipher
    pitfalls:
      - Without a clue, it looks like a random substitution. Always clue the mirror idea.
    hint_ladder:
      - Look at the coded line on <document> and at its title.
      - The title talks about reflections. Think of the alphabet in a mirror.
      - Reverse the alphabet. A pairs with Z, B with Y, C with X.
    in_world_examples:
      - The words carved under the old mirror in the hall.
      - A message from a twin who always did everything backwards.
      - A temple inscription in the old priests' reversed alphabet.
    combines_documents: false

  - id: cryptogram
    name: Keyword Substitution Cryptogram
    category: cipher
    player_action: decode
    lookup_cipher: false
    summary: Each letter is always replaced by the same other letter, as in a newspaper cryptogram.
    how_it_works: >-
      A one-to-one letter substitution. Either a keyword found elsewhere builds the key alphabet, or players break it
      with letter frequency and word shapes. A known word (a signature, a date written in words) is the usual way in.
    material: A coded letter or diary page with the spaces kept. Optionally a known word, such as a signature.
    answer_kinds: [phrase, word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [teens, adults, puzzle_fans]
    difficulty: { min: medium, max: expert }
    minutes: { easy: 10, medium: 15, hard: 22, expert: 35 }
    verification: built
    builder: cryptogram
    pitfalls:
      - A short message has several solutions. Use at least 80 letters without a key, and a known word below hard.
      - Proper nouns cannot be broken without a known word.
      - By convention, no letter maps to itself.
    hint_ladder:
      - The coded letter on <document> is the puzzle. The signature on <document> is a word that you already know.
      - Each symbol always stands for the same letter. Start with short words.
      - Find the one-letter word and the most common three-letter word, THE. Then fill in the other words.
    in_world_examples:
      - The spy's letter home, written in the agency's daily substitution.
      - A puzzle column in the town newspaper that hides a confession.
      - A love letter in the private code of two old friends.
    combines_documents: false

  - id: pigpen-cipher
    name: Pigpen Cipher
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Letters become pieces of tic-tac-toe and X grids, with or without dots.
    how_it_works: >-
      Each letter sits in a cell of two grids and two X shapes. The cell's outline, with or without a dot, is the
      symbol. The key is in the kit, or players rebuild it from a partial key.
    material: Angular symbols on a wall, map, gravestone, or box lid. A key on another prop.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 9, hard: 13, expert: 18 }
    verification: built
    builder: pigpen-cipher
    pitfalls:
      - Many variants exist. Always ship the exact key variant that the game uses, or let players derive it.
    hint_ladder:
      - The symbols on <document> are the message. The key is on <other document>.
      - These shapes are pieces of a grid. Find the grid drawing.
      - Match each symbol to the grid cell with the same outline and dot. That cell's letter is the plain letter.
    in_world_examples:
      - The secret society's marks on the lodge door.
      - Symbols scratched on the pirate's sea chest.
      - A treehouse club's password on the ladder.
    combines_documents: true

  - id: morse-code
    name: Visual Morse Code
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Short and long marks hidden in a picture or a log spell letters in Morse code.
    how_it_works: >-
      Dots and dashes hide in a visual: a fence with short and long planks, a bead necklace, a light log, stitches.
      Clear gaps or a separator object split the letters. Players read the marks with a Morse table.
    material: An illustration or a log with clear letter gaps. A Morse table in the kit unless the audience knows it.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 9, hard: 13, expert: 18 }
    verification: built
    builder: morse-code
    pitfalls:
      - Unclear letter separators are the top Morse failure. Always use a clear gap or a separator object.
      - Do not expect players to know the table. Print it in the kit.
    hint_ladder:
      - Look at the <object> on <document>. The table that you need is on <other document>.
      - Short and long marks, like a signal. The gaps split the letters.
      - It is Morse code. Read each group of short and long marks as one letter with the table.
    in_world_examples:
      - The lighthouse keeper's log of long and short flashes.
      - The prisoner's knitted scarf with short and long stitches.
      - A ship's radio log written down by the night operator.
    combines_documents: true

  - id: braille
    name: Braille Dots
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Groups of dots in a 2 by 3 cell spell letters in Braille.
    how_it_works: >-
      Dot cells of 2 columns and 3 rows hide in a picture: studs on a door, raindrops, cookies on a tray. Players
      read each cell with a Braille chart.
    material: Dot patterns in clear cells. Empty positions show as faint circles at hard difficulty.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 9, hard: 13, expert: 18 }
    verification: built
    builder: braille
    pitfalls:
      - Cell orientation and spacing can be unclear. Group each cell clearly.
      - Use a strict 2 by 3 grid at easy difficulty.
    hint_ladder:
      - Look at the dots on <document>. The chart that you need is on <other document>.
      - Count the dots in each small group. Each group is one letter.
      - Each group is a Braille letter. Match the dot positions with the chart.
    in_world_examples:
      - The studs on the vault door of a museum for the blind.
      - Cookies on the baker's tray, set out as a message.
      - A note pressed into a library card by a blind witness.
    combines_documents: true

  - id: semaphore-flags
    name: Flag Semaphore
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Two arm positions, each in one of 8 directions, show a letter.
    how_it_works: >-
      Each letter is a pair of arm angles. The arms hide in clock hands, stick figures, or tree branches. Players
      read each pose with a semaphore chart.
    material: Figures or paired hands, plus a chart that states the viewing side.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 6, medium: 10, hard: 14, expert: 20 }
    verification: built
    builder: semaphore-flags
    pitfalls:
      - The viewer's left and the signaller's left are different. State the convention in the key.
    hint_ladder:
      - Look at the figures on <document> and at the chart on <other document>.
      - The figures all hold the same kind of pose. The arm angles matter.
      - The arm angles are flag semaphore. Read each pose as one letter with the chart, from the viewer's side.
    in_world_examples:
      - Sailors on the ship's deck in a holiday photo.
      - Scarecrows in a field, each with its arms at odd angles.
      - Stopped clocks in a row, where the two hands are two flags.
    combines_documents: true

  - id: tap-code-polybius
    name: Polybius Square and Tap Code
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Pairs of numbers from 1 to 5 name the row and the column of a letter in a 5 by 5 grid.
    how_it_works: >-
      The letters sit in a 5 by 5 grid, with I and J (or C and K) in one cell. Each pair of numbers gives the row and
      then the column. Tap code shows the numbers as knocks, such as two knocks, a pause, and three knocks.
    material: A prison wall scratch, a knock log, or number pairs on a receipt.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 6, medium: 10, hard: 15, expert: 20 }
    verification: built
    builder: tap-code-polybius
    pitfalls:
      - Row then column, or column then row? Clue the order.
      - Clue which two letters share a cell.
    hint_ladder:
      - The numbers or knocks on <document> are the message.
      - The numbers come in pairs, and no number is above 5.
      - Write the alphabet in a 5 by 5 grid. The first number is the row, the second is the column.
    in_world_examples:
      - Knocks that the prisoner in the next cell logged on the wall.
      - Number pairs on a pawn shop receipt.
      - A radiator pipe that someone tapped all night, as heard by the night guard.
    combines_documents: false

  - id: vigenere-cipher
    name: Vigenere With a Found Key
    category: cipher
    player_action: decode
    lookup_cipher: false
    summary: A keyword shifts each letter by a different amount, with a printed table to help.
    how_it_works: >-
      Each letter shifts by the letter of a keyword below it, and the keyword repeats. The keyword is the answer of
      an earlier puzzle, so a wrong keyword gives nonsense. A printed table (row = key letter) does the shifting.
    material: Ciphertext plus a table of 26 shifted alphabets as a prop.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: false
    audiences: [teens, adults, puzzle_fans]
    difficulty: { min: medium, max: hard }
    minutes: { easy: 10, medium: 14, hard: 20, expert: 28 }
    verification: built
    builder: vigenere-cipher
    pitfalls:
      - It gets tedious when long. Keep the plain text at 25 letters or fewer.
      - Not for kids.
    hint_ladder:
      - You need the coded text on <document>, the table on <other document>, and a key word from an earlier puzzle.
      - The key word goes under the coded text, letter by letter. Each key letter picks a row of the table.
      - In the row of the key letter, find the coded letter. The letter at the top of that column is the plain letter.
    in_world_examples:
      - The diplomat's dispatch, locked with the password from the last envelope.
      - A will written in a code that only the true heir can read.
      - The resistance's radio message, keyed by the name of the safe house.
    combines_documents: true

  - id: a1z26-cipher
    name: Letter Numbers (A1Z26)
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Each number from 1 to 26 is a letter, so A is 1 and Z is 26.
    how_it_works: >-
      The warm-up cipher. A is 1, B is 2, up to Z is 26. Disguise the numbers as page numbers, prices, jersey
      numbers, or room numbers.
    material: A list of numbers inside a prop.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults]
    difficulty: { min: easy, max: easy }
    minutes: { easy: 4, medium: 6, hard: 10, expert: 15 }
    verification: built
    builder: a1z26-cipher
    pitfalls:
      - Too obvious when the numbers stand alone. Too hidden inside prices with decimals. Keep the numbers clean.
    hint_ladder:
      - The numbers on <document> are the message.
      - No number is above 26. How many letters does the alphabet have?
      - Turn each number into a letter. A is 1, B is 2, and so on.
    in_world_examples:
      - The jersey numbers of the team photo, in the order that the players stand.
      - The page numbers that the thief folded in the library book.
      - Locker numbers on the gym key list.
    combines_documents: false

  - id: phone-keypad
    name: Phone Keypad
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Digits stand for the letters on an old phone keypad.
    how_it_works: >-
      Each digit is a key with 3 or 4 letters. Multi-tap repeats a digit to pick the letter (22 is B), so it has one
      reading. T9 uses one digit per letter and can match several words, so the theme must pick one.
    material: Phone notes, a pager log, or a sticky note with digits. A printed keypad.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 5, medium: 9, hard: 13, expert: 18 }
    verification: built
    builder: phone-keypad
    pitfalls:
      - Many kids do not know the old phone layout. Print the keypad.
      - For T9, check that no other common word has the same digits, or let the theme decide.
    hint_ladder:
      - The digits on <document> are the message. Look at the phone on <other document>.
      - Each digit is a button with letters on it.
      - Multi-tap. Press the button once for its first letter, twice for its second, and so on. 22 is B.
    in_world_examples:
      - Digits on a sticky note next to the office phone.
      - A pager message from 1995 that someone never deleted.
      - The text that the kidnapped girl typed blind in her pocket.
    combines_documents: true

  - id: nato-alphabet
    name: NATO Phonetic Alphabet
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Code words like Alfa, Bravo, and Charlie spell a word, one letter per code word.
    how_it_works: >-
      Each letter has a code word that radio operators use: Alfa for A, Bravo for B, up to Zulu for Z. The code words
      hide in a radio log, a list of call signs, or ordinary text. Players take the first letter of each code word.
    material: A radio log, a pilot's note, or a list of names that are code words. A code word list for kids.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 4, medium: 7, hard: 11, expert: 15 }
    verification: built
    builder: nato-alphabet
    pitfalls:
      - Too easy when the code words stand alone in a list. Hide them in a log or in sentences for medium.
      - The spellings Alfa and Juliett are official. Use one spelling every time.
    hint_ladder:
      - Look at the radio log on <document>. Some words look out of place.
      - Those words are radio code words. Each one stands for one letter.
      - Take the first letter of each code word. Alfa is A, Bravo is B.
    in_world_examples:
      - The control tower's log on the night that the plane landed late.
      - Call signs of the ships in the harbor master's book.
      - A taxi radio message that the dispatcher wrote down.
    combines_documents: false

  - id: rail-fence
    name: Rail Fence Transposition
    category: cipher
    player_action: decode
    lookup_cipher: false
    summary: The right letters are in the wrong order, written in a zigzag and read row by row.
    how_it_works: >-
      The message goes in a zigzag across K rows (rails), then is read row by row. All the letters are correct,
      only their order changes. The game clues K, for example with a fence with 3 rails.
    material: A line of real letters that looks scrambled.
    answer_kinds: [phrase, word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: false
    audiences: [teens, adults, puzzle_fans]
    difficulty: { min: medium, max: hard }
    minutes: { easy: 8, medium: 12, hard: 18, expert: 25 }
    verification: built
    builder: rail-fence
    pitfalls:
      - Many players do not know that transposition exists. Use it from medium up, or clue it strongly.
    hint_ladder:
      - The scrambled line on <document> is the message. Count the rails of the fence on <other document>.
      - All the letters are correct, just in the wrong order. Think of a zigzag.
      - Draw a zigzag on <K> lines. Fill the first line with the first letters, then the next lines. Read the zigzag.
    in_world_examples:
      - Letters painted on a farm fence, one rail at a time.
      - The ranch hand's note, written the way his father taught him.
      - A message in a ladder of mailboxes.
    combines_documents: true

  - id: overlay-mask
    name: Cut-Out Mask (Cardan Grille)
    category: cipher
    player_action: physical
    lookup_cipher: false
    summary: A card with holes, laid over an innocent letter, shows only the letters of the message.
    how_it_works: >-
      Players cut the shaded windows out of a mask card and lay it over a full-page letter. The letters that show
      through the windows form the message. Registration marks on both pages line them up.
    material: A mask page with shaded windows and cut lines, plus a full letter with the same frame and marks.
    answer_kinds: [word, phrase]
    needs: { scissors: true, tape: false, fold: false, color: false }
    solo: true
    parallel: false
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 6, medium: 10, hard: 15, expert: 20 }
    verification: built
    builder: overlay-mask
    pitfalls:
      - Printer scaling breaks the alignment. Force "actual size" and add registration corners.
      - Give a no-cut fallback, such as a list of window positions (row, column).
      - Code places the message letters first, then the prose fills the rest. Never let the agent place them by hand.
    hint_ladder:
      - You need the card with grey boxes on <document> and the letter on <other document>.
      - The grey boxes on the card are windows. The two pages have the same frame.
      - Cut out the grey boxes and lay the card on the letter, corners aligned. Read the letters in the windows.
    in_world_examples:
      - A bookmark from the spy's desk with odd rectangles cut into it.
      - The card that came with an inheritance letter, "for when you read it properly".
      - A stencil from the printing shop that matches the newspaper page.
    combines_documents: true

  - id: book-cipher
    name: Book Cipher Over Kit Documents
    category: cipher
    player_action: cross-reference
    lookup_cipher: false
    summary: Number triples point to a document, a line, and a word in the kit.
    how_it_works: >-
      Triples like 3-12-4 mean document 3, line 12, word 4 (or letter 4). The "book" is a document that is already
      in the kit, such as a newspaper or a diary. Code counts by word or sentence, not by printed line.
    material: Number triples on a scrap. The source document has line numbers in the margin, or none at high difficulty.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 7, medium: 12, hard: 18, expert: 25 }
    verification: built
    builder: book-cipher
    pitfalls:
      - Text reflow changes line numbers. Index by sentence or word count, or index the final rendered layout.
      - Freeze the source document before code computes the indices.
    hint_ladder:
      - The number groups on <document> point into <other document>.
      - Three numbers each, like a reference in a library.
      - The numbers are document, line, and word. Find each word and read them in order.
    in_world_examples:
      - The numbers in the margin of the bishop's prayer book.
      - A ransom note that refers to today's newspaper.
      - The spy's grocery list that points into the town guidebook.
    combines_documents: true

  - id: symbol-substitution
    name: Invented Symbol Alphabet
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Theme symbols replace letters, and partial keys on several props complete the alphabet.
    how_it_works: >-
      Each letter is a theme symbol: runes, star signs, gang tags, alien glyphs. Two to four partial keys sit on
      different props. Players combine them, and known words (a name, a translated sign) give the missing symbols.
    material: Symbol text plus 2 to 4 partial keys. A full key for kids.
    answer_kinds: [word, phrase]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [kids, family, teens, adults, puzzle_fans]
    difficulty: { min: easy, max: hard }
    minutes: { easy: 6, medium: 11, hard: 18, expert: 25 }
    verification: built
    builder: symbol-substitution
    pitfalls:
      - Symbols that look alike in black and white at small size. Keep each symbol clearly different.
      - Every symbol in the message must be in a key, or in a known word whose other letters are known.
    hint_ladder:
      - The symbols on <document> are the message. You saw these symbols on other items too.
      - Combine the partial keys from <documents>. A sign that you can already read gives the rest.
      - Write each known symbol under its letter. Fill the gaps with the words that you can already read.
    in_world_examples:
      - The runes on the museum's new exhibit and on its gift shop sign.
      - Alien glyphs on the crashed probe and in the lab notebook.
      - The street gang's tags on three walls of the same alley.
    combines_documents: true

  - id: binary-bits
    name: Binary Lamps
    category: cipher
    player_action: decode
    lookup_cipher: true
    summary: Rows of lit and unlit items are binary numbers, and each number is a letter.
    how_it_works: >-
      Each row of on and off items (lit windows, filled circles, open shutters) is a 5-bit number. The number is a
      letter with A = 1. One example row shows the bit order.
    material: A building front or a switch panel in line art.
    answer_kinds: [word]
    needs: { scissors: false, tape: false, fold: false, color: false }
    solo: true
    parallel: true
    audiences: [teens, adults, puzzle_fans]
    difficulty: { min: easy, max: medium }
    minutes: { easy: 6, medium: 10, hard: 14, expert: 20 }
    verification: built
    builder: binary-bits
    pitfalls:
      - Bit order (left is high or left is low). Clue it with one worked example row.
    hint_ladder:
      - Look at the rows of windows on <document>.
      - Lit or unlit, just two states. Each row is a number.
      - Read each row as binary with the left side high, then turn the number into a letter. A is 1.
    in_world_examples:
      - The hotel's lit windows in a photo taken at midnight.
      - The switch panel in the engine room.
      - The holes punched in an old computer card.
    combines_documents: false

  - id: cipher-wheel
    name: Printable Cipher Wheel
    category: cipher
    player_action: physical
    lookup_cipher: true
    summary: Two paper discs, cut out and pinned, turn to line up a shifted alphabet.
    how_it_works: >-
      Two concentric paper discs, pinned with a brad or a pencil tip. Turning the inner disc to a key letter lines up
      the two alphabets. The wheel can also check answers. A slide rule of two strips is the no-cut version.
    material: Two discs on one page with cut lines and a center mark, plus the coded text.
    answer_kinds: [word, phrase]
    needs: { scissors: true, tape: false, fold: false, color: false }
    solo: true
    parallel: false
    audiences: [kids, family, teens, adults]
