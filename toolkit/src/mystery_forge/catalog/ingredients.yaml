    name: Solve a murder
    description: Find who killed the victim, how, and why.
    formats: [case_file]
    audiences: [teens, adults, puzzle_fans]
  - id: missing-person
    name: Find a missing person
    description: Someone vanished. Find where they are and why they left.
    formats: [envelopes, case_file]
