eras:
  - id: ancient-world
    name: Ancient world
    group: historical
    details: Oil lamps, wax tablets, scrolls, sundials, and water clocks. No paper money and no clocks with hands.
  - id: medieval
    name: Medieval
    group: historical
    details: Guilds, wax seals, parchment, church bells for the hours. Few people read. Travel by foot, horse, or boat.
  - id: renaissance
    name: Renaissance
    group: historical
    details: Printing presses, merchant ledgers, early maps, ciphers of courts and bankers. Clocks are rare and costly.
  - id: age-of-sail
    name: Age of Sail
    group: historical
    details: Ship's logs, flag signals, tide tables, ports, and long voyages. News travels at the speed of a ship.
  - id: victorian
    name: Victorian
    group: historical
    details: Telegrams, gas lamps, railway timetables, calling cards, and post several times a day.
  - id: belle-epoque
    name: Belle Epoque
    group: historical
    details: Early cars, world fairs, posters, the first telephones in rich homes, and airships in the news.
  - id: nineteen-twenties
    name: 1920s
    group: historical
    details: Radio broadcasts, silent films, typewriters, flapper fashion, and prohibition in some countries.
  - id: nineteen-fifties
    name: 1950s
    group: historical
    details: Rotary phones, jukeboxes, carbon copies, diners, and the space race on the front pages.
  - id: nineteen-eighties
    name: 1980s
    group: historical
    details: Pagers, cassette tapes, arcade games, early home computers, fax machines, and pay phones.
  - id: present-day
    name: Present day
    group: modern
    details: Smartphones, chat apps, CCTV, card payments, and smart homes. Plan why phones do not solve everything.
  - id: near-future
    name: Near future
    group: future
    details: Delivery drones, home assistants, lunar tourism, and face scanners. Keep the technology one step ahead.
  - id: far-future
    name: Far future
    group: future
    details: Starships, colony rules, and invented technology. State the limits of the technology up front.
  - id: fantasy-world
    name: Secondary fantasy world
    group: fantasy
    details: An invented world with its own maps and customs. State the rules and limits of any magic up front.

goals:
