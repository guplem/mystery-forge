audience_rules:
  kids:
    max_words_per_document: 120
    allow_murder: false
    themes_to_avoid: [death, blood, weapons, fear of abandonment, romance, kidnapping, real violence]
    decoders_preprinted: true
    notes: >-
      Ages 6 to 9. Lost or stolen items, pranks, and missing pets. Easy puzzles with pictures, mazes, counting, and
      simple ciphers with the key printed next to them. Short sentences and 12 to 14 pt type. Few red herrings.
  family:
    max_words_per_document: 250
    allow_murder: false
    themes_to_avoid: [gore, detailed violence, romance plots, death of a child]
    decoders_preprinted: false
    notes: >-
      Ages 10 to 13 with adults. Theft, sabotage, a kidnapping with a safe return, or a faked death. Easy to medium
      puzzles. 11 to 12 pt type and a moderate amount of text.
  teens:
    max_words_per_document: 400
    allow_murder: true
    themes_to_avoid: [graphic detail, sexual content, self-harm]
    decoders_preprinted: false
    notes: >-
      A murder may happen off-page. Easy to hard puzzles. Standard text. Keep any violence out of the
      description.
  adults:
    max_words_per_document: 600
    allow_murder: true
    themes_to_avoid: [gratuitous gore, sexual violence]
    decoders_preprinted: false
    notes: >-
      Murder, fraud, and espionage. Easy to expert puzzles. Dense documents are fine. Gore only when the config
      asks for horror.
  puzzle_fans:
    max_words_per_document: 600
    allow_murder: true
    themes_to_avoid: [gratuitous gore, sexual violence]
    decoders_preprinted: false
    notes: >-
      Adults who solve puzzle hunts. Prefer insight over grind, more meta puzzles, light signposting, and
      extraction steps that players must find. Avoid trivial mechanics such as connect-the-dots.
