tones:
  - id: cozy
    name: Cozy
    description: >-
      Warm and safe. Small communities, tea, gentle humor, and a satisfying fix at the end. Any crime stays
      off-page. Also covers whimsical and melancholy stories.
  - id: adventure
    name: Adventure
    description: >-
      Movement and discovery. Maps, journeys, ticking clocks, and brave choices. Short, active sentences.
  - id: noir
    name: Noir
    description: >-
      Dry, tired voices and morally grey people. Rain, neon, cigarette smoke, and money. Clear facts behind the
      mood. Also covers thriller stories.
  - id: spooky
    name: Spooky
    description: >-
      Eerie, never cruel. Creaks, cold rooms, and old legends with a rational answer. For kids, eerie but safe. Also
      covers gothic stories.
  - id: comedic
    name: Comedic
    description: >-
      Light and funny. Odd characters, silly misunderstandings, and running jokes. The puzzles stay fair. Also
      covers satirical stories.
  - id: dramatic
    name: Dramatic
    description: >-
      High stakes and strong feelings. Family secrets, betrayal, and hard choices. Also covers melancholy and
      thriller stories.

motifs:
  - id: clocks
    name: Clocks
    puzzle_skins: Clock hands as codes, stopped times as alibis, chimes as counts, and a timetable as the final lock.
  - id: birds
    name: Birds
    puzzle_skins: Bird ring numbers as codes, migration maps as routes, and bird songs as Morse transcripts.
  - id: chess
    name: Chess
    puzzle_skins: Chess notation as grid coordinates, knight moves as paths, and captured pieces as counts.
  - id: tarot
    name: Tarot
    puzzle_skins: Card numbers as indexes, a spread as a seating puzzle, and card names as anagrams.
  - id: maps
    name: Maps
    puzzle_skins: Grid coordinates, compass walks, map legends as symbol keys, and contour lines as hidden letters.
  - id: music
    name: Music
    puzzle_skins: Note letters on a staff, rhythm as Morse, and concert programs as timetables.
  - id: perfume
    name: Perfume
    puzzle_skins: Ingredient lists as recipe indexes, bottle shapes as silhouettes, and scent notes as sorting rules.
  - id: trains
    name: Trains
    puzzle_skins: Timetables as alibis, network maps as routes, and ticket numbers as codes.
  - id: stamps
    name: Stamps
    puzzle_skins: Stamp values as numbers, postmarks as dates and places, and perforations as dot codes.
  - id: botany
    name: Botany
    puzzle_skins: Latin plant names as anagrams, seed packets as recipe indexes, and leaf shapes as silhouettes.
  - id: astronomy
    name: Astronomy
    puzzle_skins: Star charts as connect-the-dots, moon phases as sequences, and star coordinates as a grid.
  - id: knots
    name: Knots
    puzzle_skins: Knot cords as binary or tally codes, and rope diagrams as paths.
  - id: masks
    name: Masks
    puzzle_skins: Masks as overlay windows, identity swaps, and costume lists as logic grids.
  - id: recipes
    name: Recipes
    puzzle_skins: Amounts as letter indexes, oven times as a timetable, and a menu as a strike-out puzzle.
  - id: weather
    name: Weather
    puzzle_skins: Weather reports as alibi breakers, wind directions as compass walks, and symbols as a cipher.
  - id: insects
    name: Insects
    puzzle_skins: Specimen labels as indexes, wing patterns as nonograms, and leg counts as arithmetic.
  - id: mirrors
    name: Mirrors
    puzzle_skins: Mirror writing, the mirror alphabet, reflections in photos, and symmetry puzzles.
  - id: typewriters
    name: Typewriters
    puzzle_skins: Keyboard shift ciphers, a stuck key as missing letters, and carbon copies as overlays.
  - id: card-games
    name: Card games
    puzzle_skins: Card values as numbers, suits as symbols, and a dealt hand as a sorting puzzle.
  - id: lighthouses
    name: Lighthouses
    puzzle_skins: Light patterns as Morse, a keeper's log as a timeline, and tide tables as calendar math.
  - id: keys-and-locks
    name: Keys and locks
    puzzle_skins: Key bitting as digit codes, lock attempt logs as code-breaker puzzles, and key boards as counts.
  - id: photographs
    name: Photographs
    puzzle_skins: Spot the difference, reflections, clocks in the background, and negatives as overlays.

