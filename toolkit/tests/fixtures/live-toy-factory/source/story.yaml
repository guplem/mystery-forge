        Hallworth's order to go well, not to fail.
epilogues:
  - id: solved
    min_score_percent: 75
    title: The whistle blows at four
    text: >-
      At 3:10 p.m. Greta waits at the foot of the tower, with Hubert and his big key. Rudy comes with a wooden wedge
      in his pocket and goes very quiet. At four o'clock the whistle blows, the workers run to the loading bay, and at
      6 p.m. the goods train pulls out with 2,400 robots. Hubert hands Rudy his gold tie pin, found in a nest. The
      live show still gets its big story: a jackdaw that stole a clock's keys. The bird gets a nest box on the roof.
  - id: partial
    min_score_percent: 40
    title: A close call
    text: >-
      You found part of the truth. You warn Greta that somebody means to stop the tower clock, so she watches the
      clock herself. At 3:17 p.m. the clock stops on live television, but at four Greta walks through every hall and
      calls the loading herself. The robots reach the goods yard at 5:44, just in time. Nobody can prove who planned
      it, and the jackdaw keeps a few more shiny things.
  - id: unsolved
    min_score_percent: 0
    title: The robots stay on the shelf
    text: >-
      At 3:17 p.m. the tower clock stops on live television. The whistle never blows, and when the workers notice,
      it is too late. The goods train leaves without the robots. Rudy's show gets its headlines, and the jackdaw
      watches it all from the tower.
reveal:
  - text: The clock stopped and the keys vanished from 11 December, eight days before the crew came, so the first "haunting" was not a person of the crew.
    clues: [keys-before-crew, gazette-stops]
  - text: A jackdaw takes shiny things and nests in towers; the clock-room microphone heard its "chak, chak", and the nest held the keys. Without the big key, the half winding at 6 p.m. ran out after nine hours and seventeen minutes, at 3:17; the morning half winding kept the whistle going. With the big key back, the clock ran all night.
    clues: [jackdaw-column, jackdaw-sound, nest-contents, spare-key-winding, morning-winding, clock-ran-all-night]
  - text: A bird cannot type a note or speak into a tube. The note has the broken R of the crew van typewriter. The voice came through the speaking tube, which only goes to the clock room, so a man was in the tower at 3:17.
    clues: [speaking-tube-route, voice-on-tape, van-typewriter, note-photo]
  - text: The porter wrote Rudy in at 23:55, but also out at 02:20 and back at 04:05 with cobwebs on his coat. That window fits a 15-minute drive and the slow steps and groan on the tower stairs from 02:41 to 03:45. A smooth town shoe, like Rudy's, left a print on the top step. A scrap of dark red tie silk, like Rudy's tie, hung on the clock works, and his tie pin was the only thing in the nest that did not come from the works, so he did not lose it in town. He lied about the hotel, his knee, and the pin.
    clues:
      [
        porter-in,
        porter-book,
        steps-up,
        steps-down,
        shoe-print,
        pin-photo,
        tie-silk,
        nest-contents,
        nest-only-works-things,
        rudy-hotel-claim,
        rudy-knee-claim,
        rudy-lost-pin,
      ]
  - text: The others are clear. The hostel register puts Anneliese in Birmingham, and Hubert was asleep in the gate hut. The Hotel Carrow porter brought Mr Brook tea at 03:00, five hours by car from Wickfold. He asked about the whistle for his own lorry, and he needs the order to go well.
    clues:
