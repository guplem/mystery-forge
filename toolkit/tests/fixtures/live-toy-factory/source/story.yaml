  - text: Rudy's show ends unless the Christmas special is a hit. His call sheet puts him alone in the clock room when "the clock stops again" at 15:17, and it wants the four o'clock whistle silent. Only the whistle reaches every worker, and with the goods yard closing at 5:45 the loading must start at four.
