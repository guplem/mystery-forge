intro: >-
  Wickfold, 23 December 1958, nine o'clock in the morning. At the Kessler & Daughters toy works, 2,400 Rocket
  Rex wind-up robots wait in their crates. At 6 p.m. today they must leave on the goods train for Hallworth's
  department store in London, or the factory loses the biggest order in its history. But strange things happen
  here. Since 12 December the tower clock has stopped at 3:17 every night, until last night, and brass keys have vanished. For three
  nights the crew of the television ghost show After Hours Haunts filmed the factory, and on their tape a voice
  says that the robots will never leave. This afternoon the show goes out live from the factory. The camera
  operator has secretly passed the crew's tapes, notes, and photos to the owner, Greta Kessler. Greta asks you,
  the young reporters of the Wickfold Gazette, to look at them before the show goes live. Find out who wants the
  robots to miss their train, and stop the plan before the whistle.
