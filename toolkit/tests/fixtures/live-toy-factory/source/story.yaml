format_version: 1
title: 'Tape Seven: The Clock That Ate the Keys'
tagline: A haunted toy factory, a television crew, and a goods train that must leave at 6 p.m.
premise: >-
  In December 1958 the tower clock of the Kessler & Daughters toy works in Wickfold stops at 3:17 every night,
  and brass keys vanish. A television crew films the "haunted" factory for three nights, and a voice on their
  tape says that the robots will never leave. On 23 December, the day of the big shipment, the players get the
  crew's tapes, notes, and photos. They must split the real cause of the strange events from a human plan, and
  stop that plan before the 6 p.m. goods train.
setting: Kessler & Daughters toy works, a brick factory with a clock tower in the small town of Wickfold, England
era: December 1958
tone: Adventure with a surprise twist, mild and family friendly
truth: |-
  The Kessler family came to England from the toy makers of Nuremberg in the 1920s and built the toy works in Wickfold. The "ghost" of Kessler & Daughters is a jackdaw. On 11 December 1958 the bird moved into the clock room at the top of the tower, through a broken louvre. That afternoon it took the big brass winding key from its hook by the window. Over the next days it also took seven brass robot keys from the window ledge of the packing hall, a thimble, and sweet papers. It built its nest of twigs behind the clock dial and hid everything there.

  Without the big key, Hubert Dunn, the clock keeper, wound the tower clock every evening at 6 p.m. with the little spare key. The spare key only gives a half winding, which keeps the clock going for nine hours and seventeen minutes. So from the night of 11 to 12 December, the clock stopped at 3:17 every night. Every morning at 7 a.m. Hubert set the hands and gave a second half winding with the spare key. That winding ran until 4:17 p.m., so the four o'clock whistle still blew every day. The clock then stood until Hubert set the hands and wound it again at 6 p.m., while the workers were busy at the loading bay. On 16 December the Wickfold Gazette wrote about "the clock that stops at 3:17".

  Rudy Platt, producer of the television show After Hours Haunts, read the article. His station, Crown Television, had told him that the show ends in January unless the Christmas special on 23 December brings the viewers back. He came to Wickfold with his camera operator, Fenna Okafor, on 19 December. He saw a better story than a stopped clock: the robots of a haunted factory that miss their Christmas train, live on air.

  Rudy staged events on top of the bird's work. On 19 December at 23:30, while Fenna filmed in the packing hall, he typed a warning note on the crew typewriter in the van: "THE ROBOTS WILL NEVER LEAVE. THE CLOCK KNOWS." That typewriter drops the tail of every capital R, so every R in the note looks like a P. Greta Kessler found the note on her office door at 7:30 the next morning, and Fenna photographed it at 7:35. On the night of 20 to 21 December he left the set at 23:40 and was back at the Swan Hotel at 23:55, so that the night porter saw him come in. At 02:20 he went out again by car. At 02:35 he parked in Mill Lane behind the factory, out of range of the gate microphone, and walked in through the back yard door, far from the gate hut where Hubert slept. From 02:41 to 02:46 he climbed the 64 steps to the clock room, slowly and with a groan, because of his bad knee. Fenna's microphone under the clock room recorded his steps. In the dust of the top step he left the print of his smooth town shoe. At 03:17, when the clock stopped again, he spoke into the old speaking tube that runs from the clock room down to the packing hall: "The robots will never leave." Fenna's microphone in the packing hall recorded the voice. In the dark clock room his dark red silk tie caught on a sharp edge of the clock works, beside the speaking tube. A scrap of silk tore off and stayed there, and his gold tie pin, shaped like a television aerial, fell to the floor. The jackdaw took it to its nest. At 03:40 he left the clock room, and the microphone under the clock room recorded his steps down the stairs from 03:41 to 03:45. He was back at the Swan at 04:05, with dust and cobwebs on his coat. Later he told Greta that he slept at the hotel all night and that his bad knee cannot climb the tower. He said that he lost the pin in town on 21 December.

  On 22 December at 14:00 Fenna filmed a bird that flew out of the tower louvre. Hubert climbed up and saw the print of a smooth town shoe on the dusty top step; he and Fenna both wear boots. On a sharp edge of the clock works beside the speaking tube he found a scrap of dark red tie silk. He found the nest behind the clock dial: the big winding key, seven robot keys, a thimble, sweet papers, and the gold tie pin. Everything in the nest came from the works except the pin. Hubert thought that a person had hidden the things there, and he did not know whose pin it was. At 18:00 he wound the clock with the big key. That night the clock did not stop.

  Rudy's plan for the live special on 23 December (15:00 to 16:15) is on his call sheet. From 15:10 to 15:25 he will be alone in the clock room, "no crew". He plans to jam the clock with a wooden wedge at 3:17 p.m., on camera; his call sheet only says "15:17: the clock stops again, live on camera." The tower clock blows the four o'clock whistle, and the whistle sends every worker to the loading bay. Nobody may wear a watch near the machines, and the presses are so loud that only the whistle reaches every hall. The loading of 2,400 Rocket Rex robots takes 90 minutes, the lorries need 15 minutes to reach Wickfold station, and the station master closes the goods yard at 5:45, so the loading must start at 4 p.m.; Greta wrote this in her letter. Without the whistle, the loading starts too late and the robots miss the 6 p.m. goods train to Hallworth's department store in London. Hallworth's then cancels the order. On his call sheet Rudy wrote: "If the four o'clock whistle stays silent live on air, and the robots miss their train, every newspaper in the country will write about us."

  The other suspects are innocent. Anneliese Kessler, 17, painted "GO HOME TV" on the crew van at 17:30 on 20 December, because she wants the crew gone. She also has a reason to wish the order failed: if the Hallworth's order goes well, her mother needs her to paint robot faces all through 1959, and she cannot start at the art school. But at 21:15 the same evening she took the train to Birmingham for her art school interview. She signed in at the college hostel at 23:40 and signed out at 16:00 the next day; the hostel register shows both times. Hubert Dunn fears the new electric clock that will replace him in January, but on the night of the voice he slept in the gate hut from 02:30 to 04:00; Fenna's gate microphone recorded his snoring, and he admits it in his own log. Oscar Brook of Tollmann Toys asked Greta twice exactly when the four o'clock whistle blows, and he asked about the train. He asked because Tollmann wants to sell Kessler robots in its own shops, which only works if the Hallworth's order goes well, and because a Tollmann lorry would load at the Kessler bay right after the London crates. Manchester is five hours from Wickfold by car, and there is no night train. On the night of the voice he slept at the Hotel Carrow in Manchester. At 03:00 he called the night porter for a pot of tea in room 12, and the porter wrote it on his bill. At 08:15 on 21 December he telephoned Greta from the hotel. On 22 December he left his hotel bill on Greta's desk with his written offer, to show what the trip had cost him.

  When the players expose the plan, Greta keeps Rudy away from the tower, the whistle blows at 16:00, and the robots leave on time. The jackdaw gets a nest box on the roof.
characters:
  - id: greta-kessler
    name: Greta Kessler
    role: owner of Kessler & Daughters
    description: >-
      The owner of the toy works, from a family of Nuremberg toy makers. Calm on the outside, worried on the inside. She fears that a rival company
      wants her biggest order to fail. She writes short, practical letters.
    age: 44
  - id: rudy-platt
    name: Rudy Platt
    role: producer of After Hours Haunts
    description: >-
      The producer of a television ghost show. Loud, charming, and always selling the next episode. He wears a
      lucky gold tie pin shaped like a television aerial and smooth town shoes.
    age: 38
    is_suspect: true
    is_culprit: true
    secret: His show ends in January unless the Christmas special wins back the viewers, and he staged the voice, the note, and the plan for the live show.
  - id: anneliese-kessler
    name: Anneliese Kessler
    role: toy painter, Greta's daughter
    description: >-
      Greta's daughter, who paints the faces of the robots. Quick, proud, and rude to the television crew, whom
      she wants gone. She wants to study at an art school.
    age: 17
    is_suspect: true
    secret: She painted "GO HOME TV" on the crew van, and if the Hallworth's order goes well she must paint robot faces all through 1959 instead of going to art school.
  - id: hubert-dunn
    name: Hubert Dunn
    role: clock keeper and night watchman
    description: >-
      He has wound the tower clock for 30 years and keeps a careful clock log. He loses his job in January,
      when a new electric clock replaces the old tower clock.
    age: 61
    is_suspect: true
    secret: He sleeps in the gate hut on his night shift.
  - id: oscar-brook
    name: Oscar Brook
    role: sales agent of Tollmann Toys
    description: >-
      A polite sales agent of the rival company Tollmann Toys of Manchester. He visits the factory twice in the
      same week and asks many questions about the whistle and the train.
    age: 50
    is_suspect: true
    secret: Tollmann wants to sell Kessler robots in its own shops, and he came to offer Greta a deal. He asked about the whistle because a Tollmann lorry would load at the Kessler bay right after the London crates.
  - id: fenna-okafor
    name: Fenna Okafor
    role: camera operator of After Hours Haunts
    description: >-
      The camera operator of the show. Quiet and exact. Her tape logs list every sound by the minute. She notices
      more than she says, and she passes the tapes to Greta.
    age: 29
  - id: walter-gedge
    name: Walter Gedge
    role: night porter of the Swan Hotel
    description: The night porter of the Swan Hotel in Wickfold. He writes every guest who comes in or goes out in his book.
    age: 57
  - id: jackdaw
    name: the jackdaw
    role: bird in the clock room
    description: A small crow with a grey neck that nests behind the dial of the tower clock and takes shiny things.
