in_world_reason: >-
  Rudy keeps his tricks secret even from his own crew, so that their scared faces look real on camera. In his
  pocket notebook he jumbles the key word of each trick. Fenna found this torn-out page under the seat of the van.
reveals: >-
  For Night 2 Rudy planned to park his car in Mill Lane behind the factory, out of range of the gate microphone,
  and to walk in through the back yard door.
answer: MILL LANE
accepted:
  - MILL LN
  - MILLLANE
near_misses:
  - answer: LANE MILL
    message: Right letters, but the street name reads the other way round.
  - answer: MALL LINE
    message: Right letters, but that is not a street name. Try again with a common English street word.
  - answer: NILE MALL
    message: Right letters, but Wickfold is a small English town. Think of a plain old street behind a works.
  - answer: GATE HUT
    message: Rudy wanted to stay away from the gate. Use the eight letters on his page.
decoys:
  - SWAN HOTEL
  - GATE HUT
  - FACTORY YARD
