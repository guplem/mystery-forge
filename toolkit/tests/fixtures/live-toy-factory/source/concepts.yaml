concepts:
  - title: 'Tape Seven: The Clock That Ate the Keys'
    teaser: |
      It is December 1958 at the Kessler & Daughters toy works, and the last train of wind-up robots leaves on the 23rd at six o'clock. A TV crew from "After Hours Haunts" filmed the factory for three nights: clocks stopped at 3:17, brass keys vanished, and a voice on the tape warns that the shipment will never leave. You have the crew's raw tapes, notes, and photos, and only until the whistle to find out who wants the toys to stay on the shelf.
    setting: toy-factory
    goal: stop-sabotage
    twist: animal-did-it
    frame: ghost-hunter-show
    motif: clocks
    pitch: |
      Two things happen in the factory at once, and the players must split them apart. The real "ghost" is a jackdaw that nests inside the tower clock: it takes shiny brass winding keys, and its nest jams the great clock at 3:17 each night. The show's producer, Rudy Pflug, saw a chance for a hit episode and staged extra events on top (the voice on the tape, a toppled shelf, a forged warning note). His plan for the live finale is to stop the master clock that times the conveyor and the train loading, so the shipment misses its train on camera. The twist recolors the evidence: once players see that the stopped clocks and missing keys are the bird's work, every event that a bird could not do (a typed note, a knot, a switched timetable) points to a human hand. The aha: the jackdaw's nest, found in the clock, holds Rudy's missing gold tie pin, which puts him in the tower on the night that he swears he was in town. Nobody dies; the shipment leaves, and the bird gets a new nest box.
    cast:
      - 'Greta Kessler, 44, owner of the factory, who fears that a rival company wants her biggest order to fail.'
      - 'Rudy Pflug, 38, producer of the ghost show, who needs a hit episode to keep his program on the air.'
      - "Anneliese Kessler, 17, the owner's daughter and toy painter, who openly hates the TV crew and wants them gone."
      - 'Hubert Dunkel, 61, the clock keeper and night watchman, who hides that he sleeps on his shift.'
      - "Fenna Okafor, 29, the show's camera operator, whose tapes are the main evidence and who notices more than she says."
      - 'Mr. Brask, a sales agent from the rival company Tollmann Toys, who visits the factory twice in the same week.'
    why_fun: "Players rewatch 'haunted' footage like real investigators and get a big laugh when a bird solves half the case."

  - title: 'Eclipse Week at Tycho Junior Academy'
    teaser: |
      It is the year 2219, and the Earth is about to cover the Sun above the moon base Shackleton Rim for four long days. The secret student club called the Penumbra Club has slipped you an invitation: find out who leaves anonymous gifts at the door of Dr. Ngozi Adeyemi, the base's 92-year-old founder. Solve it before the eclipse ends, when she gives away her seat on the base council forever.
    setting: moon-base-school
    goal: secret-admirer
    twist: heir-in-plain-sight
    frame: secret-society
    motif: clocks
    pitch: |
      Dr. Adeyemi plans to give her founder's seat to the council, because her only grandson left the moon as a baby and never came back. The gifts (a repaired music box, a greenhouse lily, a little clock set to Lagos time, a sketch of the first dome) come from Teodor Bakshi-Adeyemi, 19, the shy maintenance tech who winds and repairs every clock in the school. He is the missing grandson. He came back to the moon under his father's surname to meet her before he asked for anything, and the gifts are his way to say thank you for the base that she built. The admiration is family love, not romance. The twist: players first treat the staff as background, but each gift repeats a detail that only family can know (the Lagos time on the clock, the lullaby in the music box). The aha: the eclipse timetable shows that only the clock tech's rounds pass her door at every gift time, and his maintenance tag on the music box carries the same initials as the baby in her old photo.
    cast:
      - 'Dr. Ngozi Adeyemi, 92, founder of the base, who will give away her council seat at the end of the eclipse.'
      - "Teodor Bakshi, 19, the maintenance tech who keeps the school's clocks, quiet and always on his rounds."
      - 'Maribel Quispe, 15, president of the Penumbra Club, who sends the invitation and loves rules a bit too much.'
      - "Councillor Haruto Lindqvist, 50, who wants the founder's seat for himself and asks too many questions about the gifts."
      - 'Chef Amara Diallo, 35, who runs the greenhouse kitchen and knows exactly who took a lily.'
    why_fun: 'A warm, low-gravity mystery where every clue is a kindness, and the ending makes the whole table smile.'

  - title: 'The Lamp Room Must Stay Lit'
    teaser: |
      It is 1986 at Grennick Bay High School, and the county science fair opens tomorrow at 3 p.m. in the old lifeboat station. Tamsin Pengelly has rebuilt the great glass lens of the closed Gull Rock lighthouse for her project, and an anonymous note says that it will be in pieces before the judges arrive. A secret society of past winners, the Lamplighters, has chosen you: pass their trail of tests and protect the lens before the doors open.
    setting: school-science-fair
    goal: stop-sabotage
    twist: victim-set-trail
    frame: secret-society
    motif: lighthouses
    pitch: |
      There is no active Lamplighters society any more: Tamsin wrote the whole trail herself. A week ago she overheard part of a plan to break her lens, but she could not prove who it was, and she knew that nobody would believe a student without proof. So she used the old society's name and seal (found in the school archive) to recruit the players, and she hid her proof inside her puzzles: light signals in Morse, a copy of the keeper's log, and a tide table that shows when the lifeboat station is empty. The saboteur is Morwenna Jago, 17, the harbour master's daughter, who needs first prize to win the one scholarship to the marine college. She plans to swap the lens stand bolts during the setup hour so that the lens falls when the judges turn it on. The twist recolors stage 1: the "society's" tests were Tamsin's evidence all along, and the anonymous threat note came from Tamsin, to start the clock. The aha: the tide table and the sign-in sheet show that only Morwenna had the boathouse key at low tide, and Tamsin's last envelope is the photo that she took of the loosened bolts.
    cast:
      - 'Tamsin Pengelly, 16, the student who rebuilt the lighthouse lens and who is strangely calm about the threat.'
      - "Morwenna Jago, 17, the top student and the harbour master's daughter, who needs the marine college scholarship."
      - 'Mr. Kitto Rowe, 58, the physics teacher who runs the fair and hates any change to his schedule.'
      - "Declan Moyle, 16, Tamsin's ex lab partner, who left her project after a loud argument in front of the class."
      - 'Mrs. Jenna Trevaskis, 47, the lifeboat station caretaker, who holds the only key log of the building.'
    why_fun: 'The players become secret agents for a society that turns out to be one clever student, and the reveal flips every test they passed.'
