[project]
name = "mystery-forge"
version = "0.1.0"
description = "Toolkit that builds, checks, and renders printable mystery games written by AI agents."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "playwright>=1.47",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.scripts]
forge = "mystery_forge.cli:main"

[dependency-groups]
dev = [
    "fonttools[woff]>=4.50",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
    "types-jsonschema",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mystery_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: needs a Chromium-based browser (Chrome, Edge, or Playwright's Chromium)"]

# `uv run pytest --cov` measures lines and branches and fails below 100%. A line that no input can reach carries
# `# pragma: no cover` with its reason; nothing else may be left out.
[tool.coverage.run]
source = ["mystery_forge"]
branch = true
# Playwright's sync API runs the browser glue in greenlets, which coverage traces only when told to.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW1514"]
preview = true
explicit-preview-rules = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
